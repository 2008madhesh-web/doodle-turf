<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Doodle Turf</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd9ff;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block}
#land{position:fixed;top:12px;left:14px;font:30px 'Bagel Fat One',sans-serif;text-shadow:0 3px 0 #222,0 0 0 #222;-webkit-text-stroke:1px #222}
#lb{position:fixed;top:12px;right:14px;text-align:right;font-weight:800;font-size:15px;text-shadow:0 2px 0 #222}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:#fff9e6;color:#222;border:4px solid #222;border-radius:28px;box-shadow:0 8px 0 #222;padding:24px 28px;text-align:center;width:min(86vw,320px)}
h1{font:54px/1 'Bagel Fat One',sans-serif;margin:0 0 6px;color:#ff6b6b;text-shadow:0 4px 0 #222;-webkit-text-stroke:2px #222}
#msg{min-height:20px;font-weight:800;margin:6px 0 12px}
input{width:100%;box-sizing:border-box;font:800 18px inherit;padding:12px;border:4px solid #222;border-radius:18px;background:#fff;text-align:center;outline:0;margin-bottom:14px}
button{font:26px 'Bagel Fat One',sans-serif;width:100%;padding:12px;background:#ffd23f;border:4px solid #222;border-radius:22px;box-shadow:0 6px 0 #222;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #222}
small{display:block;margin-top:14px;opacity:.7;font-weight:600}
</style></head><body>
<div id="land"></div><div id="lb"></div>
<div id="menu"><div class="card"><h1>Doodle Turf</h1><div id="msg">Grab land. Don't get cut.</div>
<input id="name" maxlength="12" placeholder="Your name"><button id="play">Play</button>
<small>Drag or move the mouse to steer<br>or use A / D</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),socket=io(),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let N=80,me=0,ta=0,dirtyT=0,hue={},pl=new Map(),terrs=new Map(),trails=new Map();
// ---- scene ----
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd9ff);S.fog=new THREE.Fog(0x8fd9ff,35,110);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,250),lk=new THREE.Vector3(32,0,32);
S.add(new THREE.HemisphereLight(0xffffff,0x9ad07a,.95));
const sun=new THREE.DirectionalLight(0xfff2cc,.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18});sun.shadow.camera.updateProjectionMatrix();S.add(sun,sun.target);
const mat=c=>new THREE.MeshLambertMaterial({color:c}),D=new THREE.Object3D(),col=new THREE.Color(),clouds=[];
function build(){
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(N,N).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:tex}));gr.position.set(N/2,.01,N/2);S.add(gr);drawBg();dirtyT=1;
  const sand=new THREE.Mesh(new THREE.BoxGeometry(N+3,3,N+3),mat(0xf3d9a0));sand.position.set(N/2,-1.5,N/2);S.add(sand);
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(500,500).rotateX(-Math.PI/2),mat(0x4cc3ff));sea.position.set(N/2,-2.2,N/2);S.add(sea);
  for(let i=0;i<34;i++){const t=new THREE.Group(),s=Math.random()*(N+2)-1,side=i%4,o=Math.random()<.5?-.8:N+.8;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,.8),mat(0x8a5a2b));trunk.position.y=.4;
    const top=new THREE.Mesh(new THREE.ConeGeometry(.8,1.7,7),mat(0x3fbf6a));top.position.y=1.5;t.add(trunk,top);t.scale.setScalar(.8+Math.random()*.6);
    t.position.set(side<2?s:o,0,side<2?o:s);S.add(t)}
  for(let i=0;i<9;i++){const c=new THREE.Group();for(let j=0;j<3;j++){const b=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*1.5,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));b.position.set(j*2.4,Math.random(),0);b.scale.y=.6;c.add(b)}
    c.position.set(Math.random()*N*1.6-N*.3,16+Math.random()*8,Math.random()*N*1.6-N*.3);S.add(c);clouds.push(c)}
}
// territory = vector polygons painted on one canvas (smooth edges, cartoon outline + faux thickness)
const CS=1536,K=CS/N,tc=document.createElement('canvas'),bg=document.createElement('canvas');tc.width=tc.height=bg.width=bg.height=CS;
const cx=tc.getContext('2d'),tex=new THREE.CanvasTexture(tc);tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;
function drawBg(){const b=bg.getContext('2d');for(let i=0;i<N/4;i++)for(let j=0;j<N/4;j++){b.fillStyle=(i+j)%2?'#b6f07a':'#a6e46a';b.fillRect(i*4*K,j*4*K,4*K,4*K)}}
function ring(m){for(const pg of m)for(const r of pg){r.forEach(([x,y],i)=>i?cx.lineTo(x*K,y*K):cx.moveTo(x*K,y*K));cx.closePath()}}
function drawTerr(){cx.drawImage(bg,0,0);cx.lineJoin='round';
  for(const[id,m]of terrs){cx.save();cx.translate(0,8);cx.beginPath();ring(m);cx.fillStyle=`hsl(${hue[id]},60%,28%)`;cx.fill('evenodd');cx.restore()}
  cx.lineWidth=5;for(const[id,m]of terrs){cx.beginPath();ring(m);cx.fillStyle=`hsl(${hue[id]},70%,55%)`;cx.strokeStyle=`hsl(${hue[id]},70%,25%)`;cx.fill('evenodd');cx.stroke()}
  tex.needsUpdate=true}
function ribbonUpdate(e){ // trail = smooth ribbon from the server's points to the live head
  const T=trails.get(e.id)||[],n=Math.min(T.length/2+1,719),g=e.rb.geometry;if(n<2){g.setDrawRange(0,0);return}
  const A=g.attributes.position.array,px=j=>j<n-1?T[2*j]:e.x,pz=j=>j<n-1?T[2*j+1]:e.z;
  for(let i=0;i<n;i++){const a=Math.max(i-1,0),b=Math.min(i+1,n-1),dx=px(b)-px(a),dz=pz(b)-pz(a),l=Math.hypot(dx,dz)||1,nx=-dz/l*.3,nz=dx/l*.3;A.set([px(i)+nx,.03,pz(i)+nz,px(i)-nx,.03,pz(i)-nz],i*6)}
  g.setDrawRange(0,(n-1)*6);g.attributes.position.needsUpdate=true}
// ---- cartoony player: squishy blob, thick outline, googly eyes, name tag ----
function mk(id,name,h){
  const g=new THREE.Group(),inner=new THREE.Group(),geo=new THREE.SphereGeometry(.5,24,16);
  const body=new THREE.Mesh(geo,mat(new THREE.Color().setHSL(h/360,.75,.55)));body.scale.set(1,1.1,1);body.castShadow=true;
  const ol=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x222233,side:THREE.BackSide}));ol.scale.set(1.08,1.18,1.08);inner.add(body,ol);
  for(const z of[-.17,.17]){const e=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),new THREE.MeshBasicMaterial({color:0xffffff})),p=new THREE.Mesh(new THREE.SphereGeometry(.065,8,6),new THREE.MeshBasicMaterial({color:0x111111}));
    e.position.set(.38,.15,z);p.position.set(.49,.15,z);inner.add(e,p)}
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;const c=cv.getContext('2d');
  c.font="40px 'Bagel Fat One',sans-serif";c.textAlign='center';c.lineWidth=8;c.strokeStyle='#222';c.strokeText(name,128,46);c.fillStyle='#fff';c.fillText(name,128,46);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));sp.scale.set(2.4,.6,1);sp.position.y=1.7;
  g.add(inner,sp);S.add(g);
  const M=720,rg=new THREE.BufferGeometry(),ix=new Uint16Array((M-1)*6);rg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(M*6),3));
  for(let i=0;i<M-1;i++)ix.set([2*i,2*i+1,2*i+2,2*i+1,2*i+3,2*i+2],i*6);rg.setIndex(new THREE.BufferAttribute(ix,1));rg.setDrawRange(0,0);
  const rb=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(h/360,.85,.75),side:THREE.DoubleSide}));rb.frustumCulled=false;S.add(rb);
  return{g,inner,name,id,rb,ph:Math.random()*6}
}
// ---- network ----
socket.on('init',d=>{N=d.W;build()});
const setT=a=>{for(const[id,h,m]of a){hue[id]=h;m.length?terrs.set(id,m):terrs.delete(id)}dirtyT=1};
socket.on('full',d=>{terrs.clear();trails.clear();setT(d.t);for(const[id,f]of d.tr)trails.set(id,f)});
socket.on('t',setT);
socket.on('tr',a=>{for(const[id,f]of a){const t=trails.get(id)||[];t.push(...f);trails.set(id,t)}});
socket.on('tc',id=>trails.set(id,[]));
socket.on('me',id=>{me=id;armed=0;ptr=null;$('menu').style.display='none'});
socket.on('dead',d=>{me=0;$('msg').textContent=d.by?'Cut by '+d.by+'!':'You cut your own tail!';$('menu').style.display='flex'});
socket.on('st',s=>{const seen=new Set();
  for(const[id,name,h,x,y,a,sc]of s.p){seen.add(id);hue[id]=h;let e=pl.get(id);if(e&&e.name!==name){S.remove(e.g,e.rb);e=null}
    if(!e){e=mk(id,name,h);pl.set(id,e)}e.tx=x;e.tz=y;e.ta=a;if(id===me&&e.px===undefined)ta=a;if(id===me)$('land').textContent=sc.toFixed(1)+'%'}
  for(const[id,e]of pl)if(!seen.has(id)){S.remove(e.g,e.rb);pl.delete(id)}
  $('lb').innerHTML=s.lb.map(([n,p,h],i)=>`<div style="color:hsl(${h},95%,78%)">${i+1}. ${esc(n)} ${p}%</div>`).join('')});
// ---- input: pointer direction from screen centre, or A/D ----
const keys={};
let ptr=null,armed=0;const rc=new THREE.Raycaster(),v2=new THREE.Vector2();
const setPtr=e=>{if(me){ptr={x:e.clientX,y:e.clientY};armed=1}};addEventListener('pointermove',setPtr);addEventListener('pointerdown',setPtr);
function aim(){ // steer toward the exact ground point under the pointer (not screen-centre guesswork)
  const m=pl.get(me);if(!m||!ptr)return;v2.set(ptr.x/innerWidth*2-1,-(ptr.y/innerHeight)*2+1);rc.setFromCamera(v2,cam);
  const o=rc.ray.origin,d=rc.ray.direction;if(d.y>=0)return;const t=-o.y/d.y,gx=o.x+d.x*t,gz=o.z+d.z*t;
  if(Math.hypot(gx-m.x,gz-m.z)>1.2)ta=Math.atan2(gz-m.z,gx-m.x)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;ptr=null;armed=1});addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);
setInterval(()=>{if(!me)return;if(ptr)aim();else ta+=((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*.18;if(armed)socket.emit('in',ta)},50);
$('play').onclick=()=>socket.emit('join',$('name').value.trim());
$('name').onkeydown=e=>{if(e.key=='Enter')$('play').click()};
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
// ---- loop: smooth toward server state + squash/stretch, bob and lean ----
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000)||.016,t=now/1000,k=1-Math.exp(-dt*14);last=now;
  if(dirtyT){drawTerr();dirtyT=0}
  for(const e of pl.values()){if(e.x===undefined){e.x=e.tx;e.z=e.tz;e.a=e.ta}
    const ox=e.x,oz=e.z;let d;
    if(e.id===me){ // own head: simulate the server's steering rules locally so turning is instant, then ease toward the server
      if(e.px===undefined){e.px=e.tx;e.pz=e.tz;e.pa=e.ta;e.pw=0}
      const q=Math.atan2(Math.sin(ta-e.pa),Math.cos(ta-e.pa));
      e.pw+=(Math.max(-3.4,Math.min(3.4,q*6))-e.pw)*(1-Math.pow(.75,dt/.05));e.pa+=e.pw*dt;
      e.px=Math.min(N,Math.max(0,e.px+Math.cos(e.pa)*6*dt));e.pz=Math.min(N,Math.max(0,e.pz+Math.sin(e.pa)*6*dt));
      const c=1-Math.exp(-dt*5);e.px+=(e.tx-e.px)*c;e.pz+=(e.tz-e.pz)*c;
      if(Math.hypot(e.tx-e.px,e.tz-e.pz)>4){e.px=e.tx;e.pz=e.tz}
      e.x=e.px;e.z=e.pz;e.a=e.pa;d=e.pw*.35;
    }else{d=Math.atan2(Math.sin(e.ta-e.a),Math.cos(e.ta-e.a));e.x+=(e.tx-e.x)*k;e.z+=(e.tz-e.z)*k;e.a+=d*k}
    const v=Math.min(1,Math.hypot(e.x-ox,e.z-oz)/dt/3),sq=1+Math.sin(t*18+e.ph)*.06*v;
    e.g.position.set(e.x,.55+Math.abs(Math.sin(t*9+e.ph))*.18*v,e.z);e.g.rotation.y=-e.a;
    e.inner.rotation.x+=(Math.max(-.5,Math.min(.5,-d*.6))-e.inner.rotation.x)*k;e.inner.scale.set(1/sq,sq,1/sq);ribbonUpdate(e)}
  for(const c of clouds){c.position.x+=dt*.6;if(c.position.x>N*1.4)c.position.x=-N*.4}
  const m=me&&pl.get(me);
  if(m){cam.position.lerp(new THREE.Vector3(m.x,15,m.z+10.5),k*.6);lk.lerp(new THREE.Vector3(m.x,0,m.z-1.5),k*.6)}
  else{cam.position.set(N/2+Math.cos(t*.1)*N*.55,N*.55,N/2+Math.sin(t*.1)*N*.55);lk.set(N/2,0,N/2)}
  cam.lookAt(lk);sun.position.set(lk.x+10,25,lk.z+8);sun.target.position.copy(lk);R.render(S,cam)
})(last);
</script></body></html>
